server:
  port: 0

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
logging:
  level:
    root: INFO

spring:
  sql:
    init:
      # Всегда выполнять скрипты при старте
      mode: always
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true # Включает интеграцию Feign + Resilience4j

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/request-db
    username: user
    password: user

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - feign.RetryableException
          - java.util.concurrent.TimeoutException
          - org.springframework.cloud.client.loadbalancer.ServiceInstanceListSupplier.ServiceUnavailableException

  timelimiter:
    configs:
      default:
        timeoutDuration: 2s